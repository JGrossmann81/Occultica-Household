name: Occultica VST3
on:
  workflow_dispatch:
  push:
    paths: ['Plugins/**', '.github/workflows/occultica-vst.yml']
permissions:
  contents: write
jobs:
  dsp-check:        # the C++ engines must sound identical to the web engines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Compare C++ and web engines
        working-directory: Plugins/tests
        run: |
          g++ -O2 -std=c++17 -o render render.cpp
          fail=0
          for p in "minica 9" "minica 0" "minica 2" "minica 4" "rhodica 8" "rhodica 4" "rhodica 3" "wraithica 0" "wraithica 3" "wraithica 6" "wraithica 9" "additica 0" "additica 5" "additica 9" "grainica 0" "grainica 4" "grainica 8" "fantica 0" "fantica 13" "fantica 33" "fantica 40" "voxica 0" "voxica 5" "voxica 12" "pianica 1" "pianica 6" "reedica 0" "reedica 9" "reedica 17" "brassica 0" "brassica 8" "clavica 1" "clavica 12" "clavica 15" "stringica 0" "stringica 9" "pipica 0" "pipica 13" "percussica 0" "percussica 47" "beachica 4" "beachica 12" "avoidica 3" "avoidica 7" "industrica 3" "industrica 5" "physica 2" "physica 5" "galactica 0" "galactica 7" "galactica 10" "modica 0" "modica 9"; do
            set -- $p; ./render $1 $2 c.f32; node render.js $1 $2 j.f32
            python3 compare.py c.f32 j.f32 | tee out.txt
            python3 - <<'PY' || fail=1
          import re
          m=re.search(r'rel ([0-9.]+)', open('out.txt').read()); assert float(m.group(1))<1e-4
          PY
          done
          exit $fail
  build:
    needs: dsp-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S Plugins -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Smoke test and editor snapshots
        shell: pwsh
        run: |
          $exe = Get-ChildItem build -Recurse -Filter snapshot.exe | Select-Object -First 1
          & $exe.FullName snapshots
          if ($LASTEXITCODE -ne 0) { Write-Host "snapshot tool reported a problem"; exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: editor-snapshots, path: snapshots }
      - name: Keep the snapshots on a branch (so they can be looked at without downloading)
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/snaps && cp snapshots/*.png /tmp/snaps/ || true
          git checkout --orphan vst-previews && git rm -rf . -q && cp /tmp/snaps/*.png . && git add *.png && git commit -qm "editor snapshots" && git push -f origin vst-previews
      - name: Plugin validation (pluginval)
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pv.zip
          Expand-Archive pv.zip pv
          Get-ChildItem build -Recurse -Directory -Filter *.vst3 | ForEach-Object { Write-Host "== $($_.Name)"; $p = Start-Process pv/pluginval.exe -ArgumentList '--strictness-level','5','--validate-in-process','--skip-gui-tests',$_.FullName -Wait -PassThru -NoNewWindow; Write-Host "pluginval exit code for $($_.Name): $($p.ExitCode)"; if ($p.ExitCode -ne 0) { exit 1 } }
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pack/VST3, pack/Standalone | Out-Null
          Get-ChildItem build -Recurse -Directory -Filter *.vst3 | ForEach-Object { Copy-Item $_.FullName pack/VST3 -Recurse }
          Get-ChildItem build -Recurse -Filter *.exe | Where-Object { $_.FullName -match 'Standalone' } | ForEach-Object { Copy-Item $_.FullName pack/Standalone }
          @"
          Occultica instruments (VST3)
          1. Copy the .vst3 files from the VST3 folder to C:\Program Files\Common Files\VST3
          2. Open your music program and rescan plugins.
          The Standalone folder has the same instruments as small programs you can run without a music program (use the on-screen keyboard or a MIDI keyboard).
          Sound quality (bottom left of each window): Standard, High (2x) or Ultra (4x) oversampling. High is the default.
          "@ | Set-Content pack/README.txt
          Compress-Archive -Path pack/* -DestinationPath Occultica-VST3.zip
          Get-ChildItem pack -Recurse | Select-Object -First 40 FullName
      - uses: actions/upload-artifact@v4
        with: { name: Occultica-VST3, path: Occultica-VST3.zip }
      - name: Publish release
        shell: bash
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete vst-latest -y --cleanup-tag || true
          gh release create vst-latest Occultica-VST3.zip --title "Occultica VST3 instruments (latest)" --notes "Windows VST3 plugins and standalone programs. Unzip, copy the .vst3 files to C:\Program Files\Common Files\VST3, rescan in your music program."
